name: Update PRs

on:
  schedule:
    # 3:00am Central on Monday and Tuesday mornings (Sunday night / Monday night),
    # after weekend meet results are posted to TFRRS. GitHub cron is UTC-only, so
    # fire at both 08:00 UTC (3am CDT) and 09:00 UTC (3am CST) and let the guard
    # below skip the wrong one. Use "Run workflow" in Actions for an extra refresh.
    - cron: "0 8,9 * * 1,2"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Only scrape at 3am Central (or when run by hand)
        id: guard
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "scrape=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "03" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "scrape=false" >> "$GITHUB_OUTPUT"
          else
            echo "scrape=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.scrape == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.scrape == 'true'
        with:
          python-version: "3.12"
      - name: Scrape TFRRS + NWU roster
        if: steps.guard.outputs.scrape == 'true'
        run: python3 scraper/update.py
      - name: Commit new data
        if: steps.guard.outputs.scrape == 'true'
        run: |
          git config user.name "pr-bot"
          git config user.email "pr-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update results $(date -u +%F)"
          git push

  deploy:
    needs: update
    if: needs.update.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
